<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tháng tư là lời nói dối của em</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #17132b, #402342);
      color: #fff4fb;
      font-family: Georgia, serif;
    }
    main { max-width: 680px; padding: 2rem; text-align: center; }
    h1 { margin: 0 0 1rem; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.05; }
    p { color: #e8cddd; font-size: 1.15rem; line-height: 1.7; }
    .line { width: 5rem; height: 2px; margin: 2rem auto; background: #f3a8c8; }
  </style>
</head>
<body>
  <main>
    <div class="line"></div>
    <h1>Tháng tư là lời nói dối của em</h1>
    <p>Nhưng những ngày bên em, dù ngắn ngủi, vẫn là điều chân thật nhất.</p>
    <div class="line"></div>
  </main>
</body>
</html>
